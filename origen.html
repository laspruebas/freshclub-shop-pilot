<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origen · FRUTI</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="container origen-page">
    <header class="header">
      <div class="brand">FRUTI</div>
      <h1>Origen</h1>
      <p id="origenIntro">Trazabilidad del lote.</p>
    </header>

    <section id="origenStatus" class="status"></section>

    <section class="origen-card">
      <h2 id="origenProduct">Producto</h2>
      <div id="origenLotInfo" class="origen-info"></div>
    </section>

    <section class="origen-card">
      <h2>Recorrido</h2>
      <div id="origenTimeline"></div>
    </section>

    <section class="origen-card">
      <h2>Qué significa esta información</h2>
      <p>
        Este lote fue registrado dentro de la trazabilidad FRUTI.
        El recorrido muestra los movimientos informados por los actores
        que participaron de la cadena.
      </p>
    </section>

    <a
      class="primary-button whatsapp-button"
      href="https://wa.me/5491154886995"
    >
      Volver a WhatsApp
    </a>
  </main>

  <script type="module" src="./origen.js"></script>
</body>
</html>
